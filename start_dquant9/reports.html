<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리포트 — D.Quant 9.0 V.I.E</title>
  <meta name="description" content="D.Quant 9.0 V.I.E 성과 리포트. 3일 주기 자동 발송되는 알고리즘 운용 결과를 확인하세요.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="D.Quant 9.0 V.I.E">
  <meta property="og:title" content="성과 리포트 — D.Quant 9.0 V.I.E">
  <meta property="og:description" content="3일마다 자동 발송되는 AI 알고리즘 운용 성과 리포트. 누적 수익률과 알고리즘 작동 현황을 확인하세요.">
  <meta property="og:image" content="images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="images/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/vie.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* Tab bar */
    .tab-bar {
      display: flex;
      gap: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: 4px;
      margin-bottom: var(--space-lg);
    }
    .tab-btn {
      flex: 1;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      text-align: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: all var(--transition-fast);
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--bg-card-hover);
      color: var(--accent-blue);
      border: 1px solid rgba(0,212,255,0.2);
    }
    .tab-btn:hover:not(.active) { color: var(--text-secondary); }

    /* Report modal */
    .report-modal-body {
      background: var(--bg-secondary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      padding: var(--space-2xl);
      max-width: 620px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(20px);
      transition: transform var(--transition-base);
    }
    .modal-overlay.open .report-modal-body { transform: translateY(0); }

    .report-detail-header {
      background: linear-gradient(135deg, rgba(0,212,255,0.06), rgba(0,229,160,0.04));
      border: 1px solid rgba(0,212,255,0.15);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      margin-bottom: var(--space-lg);
    }
    .report-detail-metric {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }
    .rdm-card {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: var(--space-md);
    }
    .rdm-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; letter-spacing: 0.06em; }
    .rdm-value { font-size: 1.2rem; font-weight: 700; }

    .chart-mini { height: 120px; margin: var(--space-md) 0; }

    .report-message {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: var(--space-lg);
    }

    /* Filter row */
    .filter-row {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
      margin-bottom: var(--space-md);
    }
    .filter-select {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: border-color var(--transition-fast);
    }
    .filter-select:focus { border-color: var(--accent-blue); outline: none; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: var(--space-3xl);
      color: var(--text-muted);
    }
    .empty-state i { font-size: 2.5rem; margin-bottom: var(--space-lg); opacity: 0.4; }

    /* ── Reports Responsive ── */
    @media (max-width: 768px) {
      .filter-row { flex-direction: column; gap: 8px; }
      .filter-select { width: 100%; }
      .report-card   { padding: var(--space-md); }
      .tab-bar       { overflow-x: auto; scrollbar-width: none; }
      .tab-btn       { font-size: 0.75rem; padding: 7px 10px; white-space: nowrap; }
      .report-modal-inner { margin: var(--space-md); }
      .report-modal-body  { padding: var(--space-md); border-radius: var(--radius-lg); }
      .report-detail-metric { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .report-detail-metric { grid-template-columns: 1fr; }
      .tab-btn { font-size: 0.7rem; padding: 6px 8px; }
      .report-card-header { flex-direction: column; gap: 6px; }
    }
  </style>
</head>
<body>
  <!-- Nav -->
  <nav class="vie-nav">
    <div class="vie-nav-inner">
      <div class="vie-nav-brand">
        <a href="index.html" style="display:flex;align-items:center;gap:8px;text-decoration:none">
          <span class="vie-nav-logo">D.Quant 9.0</span>
          <span class="vie-nav-badge">V.I.E</span>
        </a>
      </div>
      <div class="vie-nav-links">
        <a href="dashboard.html" class="vie-nav-link"><i class="fa-solid fa-chart-line"></i> 대시보드</a>
        <a href="reports.html"   class="vie-nav-link active"><i class="fa-solid fa-file-lines"></i> 리포트</a>
        <a href="consult.html"   class="vie-nav-link"><i class="fa-solid fa-handshake"></i> 상담</a>
        <a href="benchmark.html" class="vie-nav-link benchmark"><i class="fa-solid fa-chart-column"></i> 벤치마크</a>
        <a href="mypage.html"    class="vie-nav-link"><i class="fa-solid fa-user"></i> My</a>
        <a href="login.html"     class="vie-nav-link" id="nav-login-btn"><i class="fa-solid fa-right-to-bracket"></i> 로그인</a>
      </div>
      <div class="vie-nav-hamburger" onclick="vieNavToggle(this)" aria-label="메뉴">
        <span></span><span></span><span></span>
      </div>
    </div>
  </nav>
  <nav class="vie-nav-mobile" id="vie-nav-mobile">
    <a href="dashboard.html" class="vie-nav-link"><i class="fa-solid fa-chart-line"></i> 대시보드</a>
    <a href="reports.html"   class="vie-nav-link active"><i class="fa-solid fa-file-lines"></i> 리포트</a>
    <a href="consult.html"   class="vie-nav-link"><i class="fa-solid fa-handshake"></i> 상담</a>
    <a href="benchmark.html" class="vie-nav-link benchmark"><i class="fa-solid fa-chart-column"></i> 벤치마크</a>
    <a href="mypage.html"    class="vie-nav-link"><i class="fa-solid fa-user"></i> My</a>
    <a href="login.html"     class="vie-nav-link" id="nav-login-btn-m"><i class="fa-solid fa-right-to-bracket"></i> 로그인</a>
  </nav>

  <div class="page-wrapper">
    <div class="page-content">
      <!-- Header -->
      <div class="section-header">
        <div class="section-eyebrow">리포트 센터</div>
        <h2 class="section-title">성과 리포트 이력</h2>
        <p class="section-subtitle">3일 주기 성과 업데이트 및 월간 정산 알림을 확인할 수 있습니다.</p>
      </div>

      <!-- Tab Bar -->
      <div class="tab-bar" id="tab-bar">
        <div class="tab-btn active" data-tab="all" onclick="switchTab('all', this)">전체</div>
        <div class="tab-btn" data-tab="performance_3d" onclick="switchTab('performance_3d', this)">3일 성과</div>
        <div class="tab-btn" data-tab="monthly_settlement" onclick="switchTab('monthly_settlement', this)">월간 정산</div>
        <div class="tab-btn" data-tab="onboarding" onclick="switchTab('onboarding', this)">온보딩</div>
      </div>

      <!-- Filter Row -->
      <div class="filter-row">
        <select class="filter-select" id="pf-filter" onchange="filterReports()">
          <option value="all">전체 포트폴리오</option>
          <!-- Options added by JS -->
        </select>
        <select class="filter-select" id="sort-filter" onchange="filterReports()">
          <option value="newest">최신순</option>
          <option value="oldest">오래된순</option>
        </select>
      </div>

      <!-- Summary stats -->
      <div class="grid-3" style="margin-bottom:var(--space-lg)" id="summary-stats">
        <div class="kpi-card">
          <div class="kpi-label"><i class="fa-solid fa-envelope" style="color:var(--accent-blue)"></i> 수신 리포트</div>
          <div class="kpi-value" id="stat-total">0</div>
          <div class="kpi-change neutral">전체 기록</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label"><i class="fa-solid fa-circle-dot" style="color:var(--accent-red)"></i> 미확인</div>
          <div class="kpi-value" id="stat-unread">0</div>
          <div class="kpi-change neutral">새 알림</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label"><i class="fa-solid fa-calendar-check" style="color:var(--accent-green)"></i> 다음 리포트</div>
          <div class="kpi-value" id="stat-next">D+3</div>
          <div class="kpi-change up"><i class="fa-solid fa-caret-up"></i> 자동 발송</div>
        </div>
      </div>

      <!-- Report List -->
      <div id="report-list">
        <div class="empty-state">
          <i class="fa-solid fa-file-lines"></i>
          <div style="font-size:1rem;font-weight:600;margin-bottom:var(--space-sm)">리포트를 불러오는 중...</div>
        </div>
      </div>

      <div style="height:120px"></div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <div class="bottom-nav-items">
      <div class="bottom-nav-item" data-page="dashboard" data-href="dashboard.html"><i class="fa-solid fa-chart-line"></i><span>대시보드</span></div>
      <div class="bottom-nav-item active" data-page="reports" data-href="reports.html"><i class="fa-solid fa-file-lines"></i><span>리포트</span></div>
      <div class="bottom-nav-item" data-page="consult" data-href="consult.html"><i class="fa-solid fa-handshake"></i><span>상담</span></div>
      <div class="bottom-nav-item" data-page="mypage" data-href="mypage.html"><i class="fa-solid fa-user"></i><span>My</span></div>
    </div>
  </nav>

  <!-- Fixed CTA -->
  <div class="dash-fixed-cta" style="position:fixed;bottom:0;left:0;right:0;z-index:50;background:linear-gradient(to top,var(--bg-primary) 70%,transparent);padding:var(--space-md) var(--space-lg)">
    <div style="max-width:440px;margin:0 auto;width:100%">
      <button class="btn btn-cta btn-full" onclick="window.location.href='consult.html'">
        <i class="fa-solid fa-handshake"></i> 밸류앤코어스와 실제 투자 상담하기
      </button>
    </div>
  </div>

  <!-- Report Detail Modal -->
  <div class="modal-overlay" id="report-modal" onclick="if(event.target===this)closeModal()">
    <div class="report-modal-body" id="modal-content">
      <!-- Populated by JS -->
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="js/vie-app.js"></script>
  <script>
    if (!VieAuth.isLoggedIn()) { window.location.href = 'login.html'; throw new Error('Not authenticated'); }
    const user = VieAuth.getUser() || {};
    const portfolios = user.selected_portfolios || ['Growth'];

    // Portfolio filter options
    const pfFilter = document.getElementById('pf-filter');
    portfolios.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t; opt.textContent = t;
      pfFilter.appendChild(opt);
    });

    // Generate mock reports
    let allReports = VieSimulator.generateReports(user);

    // Also try to load from API
    (async () => {
      try {
        const res = await VieAPI.get(VIE_CONFIG.TABLES.REPORTS, { search: user.id, limit: 50 });
        if (res.data?.length) {
          allReports = res.data.filter(r => r.user_id === user.id);
        }
      } catch(e) {}
      renderReports();
    })();

    let activeTab = 'all';

    /* ---- Stats ---- */
    function updateStats() {
      const filtered = getFilteredReports();
      document.getElementById('stat-total').textContent  = allReports.length;
      document.getElementById('stat-unread').textContent = allReports.filter(r => !r.is_read).length;
    }

    /* ---- Tab Switch ---- */
    function switchTab(tab, btn) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderReports();
    }

    /* ---- Filter ---- */
    function getFilteredReports() {
      let list = [...allReports];
      if (activeTab !== 'all') list = list.filter(r => r.report_type === activeTab);
      const pfVal = document.getElementById('pf-filter').value;
      if (pfVal !== 'all') list = list.filter(r => r.portfolio_tier === pfVal);
      const sortVal = document.getElementById('sort-filter').value;
      list.sort((a, b) => {
        const ta = new Date(a.sent_at).getTime(), tb = new Date(b.sent_at).getTime();
        return sortVal === 'newest' ? tb - ta : ta - tb;
      });
      return list;
    }

    function filterReports() { renderReports(); }

    /* ---- Type Config ---- */
    const TYPE_CONFIG = {
      onboarding:         { label: '온보딩 알림',    icon: 'fa-star',            cls: 'onboarding',  color: 'var(--accent-blue)' },
      performance_3d:     { label: '3일 성과 리포트', icon: 'fa-chart-line',      cls: 'performance', color: 'var(--accent-green)' },
      monthly_settlement: { label: '월간 정산 예고',  icon: 'fa-vault',           cls: 'settlement',  color: 'var(--accent-gold)' }
    };

    /* ---- Render ---- */
    function renderReports() {
      updateStats();
      const list = getFilteredReports();
      const container = document.getElementById('report-list');
      if (!list.length) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-file-lines"></i>
            <div style="font-size:1rem;font-weight:600;margin-bottom:8px">리포트가 없습니다</div>
            <div style="font-size:0.85rem">3일 후 첫 성과 리포트가 자동 발송됩니다.</div>
            <a href="dashboard.html" class="btn btn-outline btn-sm" style="margin-top:20px">
              <i class="fa-solid fa-arrow-left"></i> 대시보드로
            </a>
          </div>
        `;
        return;
      }
      container.innerHTML = list.map((r, idx) => {
        const tc = TYPE_CONFIG[r.report_type] || TYPE_CONFIG.onboarding;
        const pf = VIE_CONFIG.PORTFOLIOS[r.portfolio_tier];
        const isUnread = !r.is_read;
        return `
          <div class="report-card ${isUnread ? 'unread' : ''} fade-in" style="animation-delay:${idx * 0.05}s;margin-bottom:var(--space-sm)"
               onclick="openReport('${r.id}', ${idx})">
            <div class="report-icon ${tc.cls}"><i class="fa-solid ${tc.icon}"></i></div>
            <div class="report-meta">
              <div style="display:flex;align-items:center;gap:6px">
                <span class="report-type">${tc.label}</span>
                ${isUnread ? '<span style="width:6px;height:6px;border-radius:50%;background:var(--accent-blue);flex-shrink:0"></span>' : ''}
              </div>
              <div class="report-title">
                ${r.report_type === 'onboarding'         ? '가입 완료 및 알고리즘 활성화 안내' :
                  r.report_type === 'performance_3d'     ? `3일 성과 업데이트 · ${r.portfolio_tier} · +${r.cumulative_return_rate?.toFixed(2) || 0}%` :
                  r.report_type === 'monthly_settlement' ? '월간 정산 및 지급 예고' : '알림'}
              </div>
              <div class="report-preview">${(r.message_body || '').slice(0, 60)}...</div>
              <div style="display:flex;gap:var(--space-xs);margin-top:6px;flex-wrap:wrap">
                ${r.email_sent ? '<span class="channel-badge email"><i class="fa-solid fa-envelope"></i> 이메일</span>' : ''}
                ${r.kakao_sent ? '<span class="channel-badge kakao"><i class="fa-solid fa-comment"></i> 카카오</span>' : ''}
                ${pf ? `<span class="tag">${r.portfolio_tier}</span>` : ''}
                ${r.algorithm_status === 'Active' ? '<span class="algo-status" style="font-size:0.68rem;padding:2px 8px">ACTIVE</span>' : ''}
              </div>
            </div>
            <div class="report-date">${VieFmt.reltime(r.sent_at)}</div>
          </div>
        `;
      }).join('');
    }

    /* ---- Open Report Modal ---- */
    const reportIndex = {};
    function buildIndex() {
      allReports.forEach(r => { reportIndex[r.id] = r; });
    }
    buildIndex();

    let miniChart = null;

    function openReport(id, idx) {
      const r = allReports.find(x => x.id === id) || allReports[idx];
      if (!r) return;

      // Mark as read
      r.is_read = true;
      try { VieAPI.patch(VIE_CONFIG.TABLES.REPORTS, r.id, { is_read: true }); } catch(e) {}

      const tc  = TYPE_CONFIG[r.report_type] || TYPE_CONFIG.onboarding;
      const pf  = VIE_CONFIG.PORTFOLIOS[r.portfolio_tier];
      const algoInfo = VIE_CONFIG.ALGORITHMS[pf?.algo || 'D-Grouping'] || {};
      const daysSince = VieSimulator.daysSince(r.sent_at || user.signup_date);
      const profit = pf ? VieSimulator.profitAfterDays(pf.principal, pf.rate, daysSince) : 0;

      document.getElementById('modal-content').innerHTML = `
        <div class="modal-header">
          <div>
            <div class="report-type" style="color:${tc.color};margin-bottom:4px">${tc.label}</div>
            <h3 style="font-size:1.1rem">${
              r.report_type === 'onboarding'     ? '가입 완료 및 알고리즘 활성화' :
              r.report_type === 'performance_3d' ? '3일 성과 업데이트 리포트' :
              '월간 정산 및 지급 예고'
            }</h3>
          </div>
          <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- Header Info -->
        <div class="report-detail-header">
          <div style="display:flex;flex-wrap:wrap;gap:var(--space-md);align-items:center;justify-content:space-between">
            <div>
              <div style="font-size:0.72rem;color:var(--text-muted)">발송 시각</div>
              <div style="font-size:0.9rem;font-weight:600;color:var(--text-primary)">${VieFmt.datetime(r.sent_at)}</div>
            </div>
            <div>
              <div style="font-size:0.72rem;color:var(--text-muted)">포트폴리오</div>
              <div style="font-size:0.9rem;font-weight:600;color:var(--text-primary)">${r.portfolio_tier || '—'}</div>
            </div>
            <div class="algo-status">ACTIVE</div>
          </div>
          <div style="display:flex;gap:var(--space-sm);margin-top:var(--space-sm)">
            ${r.email_sent ? '<span class="channel-badge email"><i class="fa-solid fa-envelope"></i> 이메일 발송됨</span>' : ''}
            ${r.kakao_sent ? '<span class="channel-badge kakao"><i class="fa-solid fa-comment"></i> 카카오 발송됨</span>' : ''}
          </div>
        </div>

        <!-- Metrics -->
        <div class="report-detail-metric">
          <div class="rdm-card">
            <div class="rdm-label">누적 수익률</div>
            <div class="rdm-value text-green">+${(r.cumulative_return_rate || 0).toFixed(2)}%</div>
          </div>
          <div class="rdm-card">
            <div class="rdm-label">누적 수익금</div>
            <div class="rdm-value">${VieFmt.manwon(Math.round(profit))}</div>
          </div>
          <div class="rdm-card">
            <div class="rdm-label">알고리즘</div>
            <div class="rdm-value" style="font-size:0.9rem">
              <i class="fa-solid ${algoInfo.icon}" style="color:${algoInfo.color}"></i> ${pf?.algo || '—'}
            </div>
          </div>
          <div class="rdm-card">
            <div class="rdm-label">운용 원금</div>
            <div class="rdm-value">${pf ? VieFmt.manwon(pf.principal) : '—'}</div>
          </div>
        </div>

        <!-- Mini Chart -->
        ${pf ? `
          <div class="chart-mini">
            <canvas id="mini-chart"></canvas>
          </div>
        ` : ''}

        <!-- Message -->
        <div class="report-message">
          <div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:8px;letter-spacing:0.08em">리포트 메시지</div>
          ${r.message_body || '운용 상태가 활성화되어 있습니다.'}
          <div style="margin-top:12px;font-size:0.82rem;color:var(--text-secondary)">
            선택하신 전략은 현재 정상적으로 활성화되어 있습니다.<br>
            누적 성과는 안정적으로 반영되고 있습니다.
          </div>
        </div>

        <!-- Report CTA -->
        <div style="background:linear-gradient(135deg,rgba(0,229,160,0.06),rgba(0,212,255,0.04));border:1px solid rgba(0,212,255,0.15);border-radius:var(--radius-lg);padding:var(--space-lg);text-align:center">
          <div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:var(--space-md)">
            현재 경험 중인 가상 투자 흐름을 바탕으로<br>실제 운용 구조를 안내받으세요.
          </div>
          <button class="btn btn-cta btn-full" onclick="window.location.href='consult.html'">
            <i class="fa-solid fa-handshake"></i>
            밸류앤코어스와 실제 투자 상담하기
          </button>
        </div>
      `;

      document.getElementById('report-modal').classList.add('open');

      // Draw mini chart
      if (pf) {
        setTimeout(() => {
          const days = Math.max(daysSince, 10);
          const labels = Array.from({ length: 8 }, (_, i) => 'D+' + Math.floor(i * days / 7));
          const data   = labels.map(l => {
            const d = parseInt(l.replace('D+', ''));
            return Math.round(pf.principal + VieSimulator.profitAfterDays(pf.principal, pf.rate, d));
          });
          const algoClr = algoInfo.color || '#00d4ff';
          const ctx = document.getElementById('mini-chart');
          if (ctx) {
            if (ctx._chartInstance) ctx._chartInstance.destroy();
            ctx._chartInstance = new Chart(ctx, {
              type: 'line',
              data: {
                labels,
                datasets: [{
                  data,
                  borderColor: algoClr,
                  backgroundColor: algoClr + '15',
                  fill: true, tension: 0.4, borderWidth: 2,
                  pointRadius: 2, pointBackgroundColor: algoClr
                }]
              },
              options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ' ' + c.parsed.y.toLocaleString('ko-KR') + '만원' } } },
                scales: {
                  x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#4a5578', font: { size: 9 } } },
                  y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#4a5578', font: { size: 9 }, callback: v => v.toLocaleString('ko-KR') + '만' } }
                }
              }
            });
          }
        }, 50);
      }
      renderReports(); // refresh read state
    }

    function closeModal() {
      document.getElementById('report-modal').classList.remove('open');
    }

    renderReports();
  </script>
</body>
</html>
